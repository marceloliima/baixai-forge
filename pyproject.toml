[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baixai-forge"
version = "1.1.0"
description = "Downloader local robusto com FastAPI, yt-dlp, fila persistente e interface web."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Baixaí Forge Contributors"}]
keywords = ["yt-dlp", "fastapi", "downloader", "local", "video", "audio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.52.4,<0.53",
  "pydantic>=2.13.5,<3",
  "Jinja2>=3.1,<4",
  "python-dotenv>=1.2.3,<2",
  "yt-dlp[default]>=2026.8.19",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]

[project.scripts]
baixai-forge = "baixai_forge.__main__:main"

[tool.setuptools.packages.find]
include = ["baixai_forge*"]

[tool.setuptools.package-data]
baixai_forge = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
